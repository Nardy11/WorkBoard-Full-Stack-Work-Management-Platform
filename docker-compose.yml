services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workboard
      POSTGRES_PASSWORD: workboard
      POSTGRES_DB: workboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./apps/api
    environment:
      NODE_ENV: development
      API_PORT: 3001
      DATABASE_URL: postgresql://workboard:workboard@postgres:5432/workboard
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
